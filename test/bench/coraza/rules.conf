# Same ruleset as test/local — benchmark measures overhead of these specific rules.
# Keep this in sync with test/local/coraza/rules.conf.

SecRule REQUEST_URI "@contains blockme" \
    "id:1001,phase:1,deny,status:401,log,msg:'Blocked URI pattern (blockme)',tag:'TEST/URI_BLOCK'"

SecRule REQUEST_HEADERS:User-Agent "@contains badbot" \
    "id:1002,phase:1,deny,status:403,log,msg:'Bad bot user-agent',tag:'TEST/BAD_BOT'"

SecRule REQUEST_HEADERS:X-Attack "@rx .+" \
    "id:1003,phase:1,deny,status:403,log,msg:'X-Attack header',tag:'TEST/HEADER_ATTACK'"

SecRule REQUEST_BODY "@rx (?i)drop\s+table" \
    "id:1004,phase:2,deny,status:403,log,msg:'SQL DROP TABLE in body',tag:'TEST/SQLI'"

SecRule ARGS "@rx <script" \
    "id:1005,phase:1,deny,status:403,log,msg:'XSS probe in args',tag:'TEST/XSS'"
