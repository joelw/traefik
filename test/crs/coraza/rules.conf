# ---------------------------------------------------------------------------
# Site-specific custom rules — loaded AFTER the OWASP CRS via rulesFiles.
#
# This is the same ruleset as test/local/coraza/rules.conf, kept in sync
# so that the CRS test also validates that custom rules coexist with CRS.
#
# Rule ID range 1000-1999 / 2000-2999 avoids clashing with CRS (900000+)
# and Coraza reserved ranges.
# ---------------------------------------------------------------------------

# ---- Rule 1001 — URI contains 'blockme' → 401 Unauthorized ---------------
# Custom phase:1 deny — fires before CRS anomaly scoring (which blocks in phase:2).
SecRule REQUEST_URI "@contains blockme" \
    "id:1001,\
    phase:1,\
    deny,\
    status:401,\
    log,\
    msg:'Custom rule: blocked URI pattern (blockme)',\
    tag:'CUSTOM/URI_BLOCK'"

# ---- Rule 1002 — User-Agent contains 'badbot' → 403 Forbidden ------------
SecRule REQUEST_HEADERS:User-Agent "@contains badbot" \
    "id:1002,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Custom rule: bad bot user-agent',\
    tag:'CUSTOM/BAD_BOT'"

# ---- Rule 1003 — X-Attack header present → 403 Forbidden ----------------
SecRule REQUEST_HEADERS:X-Attack "@rx .+" \
    "id:1003,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Custom rule: X-Attack header detected',\
    tag:'CUSTOM/HEADER_ATTACK'"

# ---- Rule 1004 — Request body contains 'drop table' → 403 ---------------
# Note: CRS also detects SQL injection in bodies (via anomaly scoring).
# This custom rule provides an immediate phase:2 block as a belt-and-braces
# measure for this specific pattern, independent of the anomaly threshold.
SecRule REQUEST_BODY "@rx (?i)drop\s+table" \
    "id:1004,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom rule: SQL DROP TABLE in request body',\
    tag:'CUSTOM/SQLI'"
