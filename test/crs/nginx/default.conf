server {
    listen 80;
    server_name _;

    # Fixed-size JSON response for all paths.
    # CRS test assertions care only about whether the WAF blocks (non-200)
    # or passes through (200); the backend response body is irrelevant.
    location / {
        default_type application/json;
        return 200 '{"status":"ok","path":"$request_uri"}';
    }
}
