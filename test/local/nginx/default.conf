server {
    listen 80;
    server_name _;

    # Default: simple JSON response for all paths.
    location / {
        default_type application/json;
        return 200 '{"status":"ok","path":"$request_uri"}';
    }

    # Phase 3 test target — leaks a sensitive value in a response header.
    # Coraza rule 2001 matches RESPONSE_HEADERS:X-Internal-Data and blocks it.
    location /test/response-header {
        add_header X-Internal-Data "leaked_token=abc123secret" always;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Phase 4 test target — leaks a sensitive pattern in the response body.
    # Coraza rule 2002 matches RESPONSE_BODY "@contains" and blocks it.
    location /test/response-body {
        default_type application/json;
        return 200 '{"status":"ok","debug":"db_password=p4ssw0rd_internal"}';
    }
}
