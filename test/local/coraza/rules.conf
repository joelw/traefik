# ---------------------------------------------------------------------------
# Coraza test rules — loaded via CorazaWAF.rulesFile
#
# SecRuleEngine is set via inline Directives in traefik dynamic config,
# so only the actual rules live here. Add "SecRuleEngine On" here too if
# you want this file to be self-contained for testing outside Traefik.
# ---------------------------------------------------------------------------

# ---- Rule 1001 — URI contains 'blockme' → 401 Unauthorized ---------------
# Matches: /blockme, /foo/blockme/bar, /page?q=blockme
SecRule REQUEST_URI "@contains blockme" \
    "id:1001,\
    phase:1,\
    deny,\
    status:401,\
    log,\
    msg:'Test rule: blocked URI pattern (blockme)',\
    tag:'TEST/URI_BLOCK'"

# ---- Rule 1002 — User-Agent contains 'badbot' → 403 Forbidden ------------
SecRule REQUEST_HEADERS:User-Agent "@contains badbot" \
    "id:1002,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Test rule: bad bot user-agent',\
    tag:'TEST/BAD_BOT'"

# ---- Rule 1003 — X-Attack header present → 403 Forbidden ----------------
# Simulates a custom header injection rule.
SecRule REQUEST_HEADERS:X-Attack "@rx .+" \
    "id:1003,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Test rule: X-Attack header detected',\
    tag:'TEST/HEADER_ATTACK'"

# ---- Rule 1004 — Request body contains 'drop table' → 403 ---------------
# Requires SecRequestBodyAccess On (set via Directives in traefik config).
SecRule REQUEST_BODY "@rx (?i)drop\s+table" \
    "id:1004,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Test rule: SQL DROP TABLE in request body',\
    tag:'TEST/SQLI'"

# ---- Rule 1005 — Query string contains classic XSS probe → 403 ----------
SecRule ARGS "@rx <script" \
    "id:1005,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Test rule: XSS probe in query args',\
    tag:'TEST/XSS'"
